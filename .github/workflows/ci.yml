name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud_mode: ["false", "true"]
    name: lint-and-test (CLOUD_MODE=${{ matrix.cloud_mode }})
    env:
      CLOUD_MODE: ${{ matrix.cloud_mode }}
      # Fail (not skip) if the real-model test can't find its cached model.
      REQUIRE_REAL_MODEL: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Cache Whisper test model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Systran--faster-whisper-tiny.en
          key: whisper-tiny.en-v1

      # Downloaded here, outside pytest: the tests block network access and load
      # the model with local_files_only.
      - name: Download Whisper test model
        run: python -c "from faster_whisper import download_model; download_model('tiny.en')"

      - name: Pytest
        run: pytest -q
