# Example secrets. Copy the values you need into Streamlit Community Cloud
# (App settings > Secrets), or locally into .streamlit/secrets.toml (git-ignored).
# Placeholders only: never put real keys in this file.

# Optional on Community Cloud: cloud mode is switched on automatically there.
CLOUD_MODE = true

# Optional overrides (cloud defaults shown)
WHISPER_MODEL = "small.en"
WHISPER_COMPUTE_TYPE = "int8"

